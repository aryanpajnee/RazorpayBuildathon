[project]
name = "mandate"
version = "0.1.0"
description = "A merchant that AI agents can transact with, under signed and bounded authority."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pynacl>=1.5",
    "razorpay>=1.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "mcp>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
